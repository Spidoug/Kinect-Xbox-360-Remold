# SynKinect Studio 1.0 - Acoustic spatial-audio policy
ui.frameRate=30
ui.font.family=SansSerif
ui.font.headingFamily=SansSerif
ui.font.fallback=Dialog
lifecycle.workerJoinMs=1200
transport.reconnectMs=300
transport.pipeOpenAttempts=4
transport.pipeOpenRetryMs=75
transport.noFrameWarningMs=4000
transport.connectionStaleMs=9000

scan.soundSpeedMps=343.0
scan.minimumRms=0.0018
scan.occupancyDecay=0.94
geometry.microphoneXM=0.113,-0.036,-0.076,-0.113

# Voice activity detection. AUTO never steers on raw loudness alone.
voice.lowHz=100
voice.highHz=3600
voice.bandMinRatio=0.56
voice.snrOnDb=10.0
voice.snrOffDb=6.0
voice.probability=0.70
voice.attackFrames=5
voice.releaseFrames=14
voice.noiseAdaptDown=0.16
voice.noiseAdaptUp=0.006

# Near-field localization search.
locate.xMinM=-2.5
locate.xMaxM=2.5
locate.zMinM=0.30
locate.zMaxM=4.0
locate.xSteps=51
locate.zSteps=38

# Voice-aware AUTO beam steering.
beam.autoConfidence=0.075
beam.autoMaxSpreadDeg=8.0
beam.autoDeadbandDeg=7.0
beam.autoMaxSlewDegPerSec=35.0
beam.autoDwellFrames=16
beam.autoHoldMs=1200
beam.autoUpdateMinMs=90
beam.outputGain=1.25
beam.queueFrames=10
beam.lineBufferBytes=8192

# Adaptive spectral noise suppression after the spatial beamformer.
noise.enabled=true
noise.overSubtract=1.35
noise.minGain=0.10
noise.adapt=0.035
noise.speechAdapt=0.0015
