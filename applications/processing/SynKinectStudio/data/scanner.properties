ui.frameRate=30
# Native Windows UI typography; resolved against installed fonts at runtime.
ui.font.family=SansSerif
ui.font.headingFamily=SansSerif
ui.font.fallback=Dialog
lifecycle.workerJoinMs=1500
# SynKinect 3D Scanner runtime configuration.

# Metric depth / Kinect calibration
# Near-object policy: do not discard valid short-range samples. The physical
# Kinect 1414 optical minimum still applies; software cannot invent depth where
# the sensor returns 0/invalid.
depth.minM=0.20
depth.maxM=4.50
depth.plausibleMinMm=180
depth.plausibleMaxMm=6000
depth.minimumValidPixels=1200
depth.minimumValidRatio=0.004
depth.histogramBinMm=20
calibration.depth.fx=594.2143421192325
calibration.depth.fy=591.0405369687078
calibration.depth.cx=339.30780975300314
calibration.depth.cy=242.73913761751615
calibration.depth.scale=0.001

# Foreground target acquisition
target.bandM=0.24
target.maxBandM=0.48
target.smoothing=0.18
target.stableToleranceM=0.12
target.maxJumpM=0.38
target.minimumConfidence=0.040
target.minimumSamples=80
target.stableFrames=3
target.reacquireFrames=6
target.roi.left=0.24
target.roi.right=0.76
target.roi.top=0.20
target.roi.bottom=0.80
target.roi.sampleStep=2
target.preferredWindowM=0.30

# Transport liveness
transport.streamStaleMs=2400
transport.connectionStaleMs=7000
transport.reconnectMs=180

fusion.queueFrames=3
fusion.maxFps=8

# Point cloud / ICP
# V1 real-time profile: fusion keeps TSDF resolution but samples every second depth pixel.
# ICP cell size matches max correspondence distance, avoiding a 7x7x7 hash search.
cloud.previewStep=3
cloud.integrationStep=2
cloud.spatialFilter=true
cloud.neighborToleranceM=0.055
tracking.minimumPoints=320
tracking.icpIterations=7
tracking.icpMinimumMatches=80
tracking.icpCellSizeM=0.055
tracking.icpMaxDistanceM=0.055
tracking.icpMaxSamples=3000
tracking.icpGoodRmsM=0.030

# High-quality final reconstruction
# Capture remains realtime. When the mesh is built, retained keyframes are
# robustly re-registered, loop-closed on a complete turn and re-integrated at
# higher spatial resolution. This extracts more repeatable detail without
# making Start Scan or the live preview heavy.
quality.enabled=true
quality.keyframes.max=200
quality.keyframes.minRotationDeg=2.0
quality.keyframes.minTranslationM=0.004
quality.keyframes.minimum=12
quality.integrationStep=1
quality.volumeSize=288
quality.voxelSizeM=0.0023
quality.truncationM=0.009
quality.meshMinimumWeight=3
quality.icpIterations=12
quality.localMapFrames=3
quality.icpMaxSamples=12000
quality.icpMinimumMatches=220
quality.icpMaxDistanceM=0.030
quality.icpTrimFraction=0.78
quality.icpGoodRmsM=0.012
quality.loopClosure=true
quality.loopClosureMaxRmsM=0.018
quality.depthFilterRadius=2
quality.depthEdgeToleranceM=0.028
quality.holeFillMinimumNeighbors=12
quality.distanceWeightedTsdf=true
# Multi-frame depth super-resolution. Neighboring calibrated keyframes are
# transformed into a common anchor camera after global pose refinement and
# accumulated on a 2x subpixel grid. Foreground z-buffering rejects occluded
# background samples; a tighter temporal gate rejects inconsistent depth.
quality.depthSuperResolution.enabled=true
quality.depthSuperResolution.scale=2
quality.depthSuperResolution.windowFrames=5
quality.depthSuperResolution.anchorStride=2
quality.depthSuperResolution.maxRotationDeg=6.0
quality.depthSuperResolution.maxTranslationM=0.030
quality.depthSuperResolution.occlusionToleranceM=0.014
quality.depthSuperResolution.outlierToleranceM=0.010
quality.depthSuperResolution.minimumViews=2
quality.depthSuperResolution.maxPoints=420000
# Keep final smoothing deliberately light: the higher-resolution TSDF should
# preserve small features instead of hiding them under aggressive polishing.
quality.meshPolishIterations=1
quality.meshPolishLambda=0.18
quality.meshPolishMu=-0.19

# Per-device Kinect v1 depth calibration. A flat wall is sampled at multiple
# distances; the Studio fits an affine correction and temporal noise estimate
# for every depth pixel and stores the profile by stable device ID.
calibration.depthCorrection.enabled=true
calibration.depthCorrection.stations=5
calibration.depthCorrection.framesPerStation=10
calibration.depthCorrection.minimumStationsPerPixel=3
calibration.depthCorrection.distanceSeparationM=0.16
calibration.depthCorrection.stabilityToleranceM=0.018
calibration.depthCorrection.planeResidualMaxM=0.030
calibration.depthCorrection.slopeMin=0.92
calibration.depthCorrection.slopeMax=1.08
calibration.depthCorrection.offsetMaxM=0.060
calibration.depthCorrection.noiseFloorM=0.0015
calibration.depthCorrection.noiseCeilingM=0.030

# Fusion / mesh
fusion.volumeSize=192
fusion.voxelSizeM=0.0035
fusion.truncationM=0.016
mesh.minimumWeight=2
mesh.cleanupMaxEdgeM=0.10
mesh.cleanupMinAreaM2=0.00000010
mesh.weldToleranceM=0.0010
mesh.smoothIterations=2
mesh.smoothLambda=0.30
# Automatic final polish: clean components + Taubin lambda/mu smoothing.
mesh.polishIterations=3
mesh.polishLambda=0.34
mesh.polishMu=-0.36
mesh.minimumComponentTriangles=32
mesh.minimumComponentRatio=0.002
# Kinect RGB/depth registration and temporal texture fusion.
# Registration is depth dependent: each metric depth sample is back-projected,
# transformed into the RGB camera coordinate system, lens-distorted/projected,
# occlusion checked, then bilinearly sampled. offsetX/Y are only fine corrections.
mesh.rgb.enabled=true
mesh.rgb.offsetX=0
mesh.rgb.offsetY=0
mesh.rgb.maxSyncSkewMs=22
mesh.rgb.occlusionFilter=true
mesh.rgb.occlusionToleranceM=0.025
mesh.rgb.autoRefine=true
mesh.rgb.refineEveryFrames=6
mesh.rgb.refineSearchPx=5
mesh.rgb.refineSampleStep=8
mesh.rgb.refineEdgeThresholdMm=65
mesh.rgb.refineMinimumEdges=48
mesh.rgb.refineAlpha=0.08
mesh.rgb.refineMaxOffsetPx=6
# Exposure-quality weighting does not invent pixels. Well-exposed synchronized
# views receive more color weight, so keeping the object in view longer improves
# the final texture through multi-view temporal fusion.
mesh.rgb.exposureLowLuma=24
mesh.rgb.exposureHighLuma=235
mesh.rgb.temporalColorWeightMax=8

# HQ color keyframes. Kinect v1 exposes raw Bayer 1280x1024 at a lower frame
# rate than VGA. The Scanner negotiates HQ only after its module is explicitly
# selected. If the sensor does not produce a complete HQ frame during probation,
# the bridge falls back in-place to RGB VGA while Depth remains 640x480/30 fps.
mesh.rgb.hq.enabled=false
mesh.rgb.hq.historyFrames=8
mesh.rgb.hq.maxSyncSkewMs=90
mesh.rgb.hq.minimumFrameQuality=0.22
mesh.rgb.hq.photometricNormalize=true
mesh.rgb.hq.gainMin=0.72
mesh.rgb.hq.gainMax=1.38
mesh.rgb.hq.sharpenAmount=0.16

# Representative Kinect v1 RGB calibration profile. Replace these values with a
# per-device stereo calibration for the best possible alignment.
calibration.rgb.fx=529.215081
calibration.rgb.fy=525.563936
calibration.rgb.cx=328.942720
calibration.rgb.cy=267.480682
calibration.depth.k1=-0.263864
calibration.depth.k2=0.999668
calibration.depth.p1=-0.000762
calibration.depth.p2=0.005035
calibration.depth.k3=-1.305362
calibration.rgb.k1=0.207966
calibration.rgb.k2=-0.586138
calibration.rgb.p1=0.000722
calibration.rgb.p2=0.001048
calibration.rgb.k3=0.498570
calibration.depthToRgb.r00=0.9998463
calibration.depthToRgb.r01=0.0012635
calibration.depthToRgb.r02=-0.0174872
calibration.depthToRgb.r10=-0.0014779
calibration.depthToRgb.r11=0.9999239
calibration.depthToRgb.r12=-0.0122514
calibration.depthToRgb.r20=0.0174704
calibration.depthToRgb.r21=0.0122753
calibration.depthToRgb.r22=0.9997720
calibration.depthToRgb.tx=0.01998524
calibration.depthToRgb.ty=-0.00074424
calibration.depthToRgb.tz=-0.01091674

# Rotation / coverage rules
scan.fullTurnDeg=360
scan.completeDeg=355
scan.rotationDeadbandDeg=0.30
scan.rotationMaxStepDeg=24
scan.directionLockDeg=5
scan.maxSensorTiltDriftDeg=10
scan.autoPauseOnFullTurn=true

# External photos / export
photos.defaultHorizontalFovDeg=55
photos.defaultDistanceM=0.35
photos.defaultPitchDeg=0
photos.poseFile=SynKinect_photo_poses.csv
export.baseName=SynKinectScan

# Canonical RGBD synchronization policy. Scanner and Interactivity use the same
# pairing rules and calibration math, but each module owns its own live transport.
# Reconstruction is latency-bounded: stale queued pairs are discarded in favor of newer data.
transport.rgbdQueueFrames=3
transport.rgbdSyncHistoryFrames=6
transport.rgbdSyncMaxResidualMs=22
transport.rgbdSyncBootstrapMaxSkewMs=180
transport.rgbdSyncOffsetAlpha=0.06
transport.drainFramesPerDraw=10
fusion.queueFrames=4

# Compact export. Vertices are welded/indexed and PLY is written as binary LE.
# STL is additionally reduced through vertex clustering up to this tolerance.
export.weldToleranceM=0.0010
export.maxWeldToleranceM=0.004
export.maxTriangles=600000
export.textureMaxSize=4096
export.jpegQuality=0.90
