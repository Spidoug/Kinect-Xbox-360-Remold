# SynKinect Studio 1.0 - native SynKinect Body depth skeleton + calibrated RGB overlay
transport.workerJoinMs=2200
transport.streamStaleMs=1800
vision.previewHz=15
vision.minDepthMm=550
vision.maxDepthMm=3800

# Dependency-free body estimator. The Studio segments the nearest plausible human
# component directly from metric Depth and builds the articulated 3D skeleton itself.
pose.minCoreConfidence=0.28
pose.occlusionHoldFrames=8
pose.filterMinAlpha=0.18
pose.filterMaxAlpha=0.78
pose.velocityAlpha=0.22
pose.maxSpeedMps=4.2
body.sampleStep=4
body.depthBinMm=80
body.depthBandMm=520
body.continuityMm=320
body.minSamples=90
body.minHeightPx=100
body.histogramCapSamples=1400
body.maxWidthRatio=0.86
body.centerBias=0.70
body.minAspect=0.82

# Lightweight local hand-state estimate used only for interaction gestures.
hand.localRadiusPx=22
hand.depthToleranceMm=150
hand.openRadiusMinPx=10
hand.openRadiusMaxPx=28

cursor.mirrorX=true
cursor.hand=right
cursor.maxHz=60
cursor.lostReleaseMs=800
cursor.deadzonePx=1.8
cursor.fastAlpha=0.62
cursor.slowAlpha=0.20
