# SynKinect Surveillance V1.0 - multi-Kinect, self-contained recording.
ui.frameRate=30
ui.font.family=Segoe UI
ui.font.headingFamily=Segoe UI Semibold
ui.font.fallback=Arial
lifecycle.workerJoinMs=1800

# Surveillance owns exactly one video stream: RGB in normal light or IR in
# darkness. It never requests Depth.
transport.reconnectMs=180
night.enterLuma=0.18
night.exitLuma=0.30
night.darkFrames=12
night.brightFrames=4
night.probeFrames=6
night.irProbeLuma=0.78
night.irProbeFrames=45
night.probeIntervalMs=30000
transport.videoQueueFrames=64

# RGB/IR temporal-luma motion detection.
motion.sampleStep=8
motion.lumaDelta=0.08
motion.minimumValidSamples=400
motion.minimumChangedRatio=0.025
motion.armFrames=3
motion.warmupFrames=10
motion.stopAfterMs=60000

# In-RAM retention and final video use the SAME compressed JPEG frames.
# 320x240 @ 5 fps uses adaptive JPEG quality with a 10 KiB/frame target.
# The nominal video budget is about 2.9 MiB/min before small AVI overhead,
# with no external encoder process or native video codec.
retention.minutes=10
retention.preRollSeconds=60
retention.fps=5
retention.jpegQuality=0.40
retention.jpegMinQuality=0.20

overlay.timestamp.format=yyyy-MM-dd HH:mm:ss
overlay.timestamp.margin=10

# Self-contained Motion-JPEG AVI output.
record.fps=5
record.width=320
record.height=240
record.queueSeconds=30
record.targetFrameKB=10
record.directory=recordings
