ui.frameRate=30
ui.font.family=SansSerif
ui.font.headingFamily=SansSerif
ui.font.fallback=Dialog
lifecycle.workerJoinMs=1200
# SynKinect Microphones runtime policy. Keep tuning here instead of source code.

# Transport / diagnostics
transport.reconnectMs=300
transport.pipeOpenAttempts=4
transport.pipeOpenRetryMs=75
# The native AudioBridge publishes the same 4-channel ABI on two independent
transport.noFrameWarningMs=4000
transport.connectionStaleMs=9000
diagnostics.refreshMs=500
diagnostics.staleMs=3000
diagnostics.directory=Kinect360Remold
diagnostics.file=audio-bridge-status.txt

# Recording
record.directory=recordings
record.filePrefix=KinectMics

# Live monitor / playback
monitor.queueFrames=8
monitor.targetPeak=0.55
monitor.maxGain=64.0
monitor.gainSmoothing=0.18
monitor.lineBufferBytes=4096
playback.lineBufferBytes=8192

# Speaker self-test
speaker.frequencyHz=700
speaker.durationMs=750
speaker.amplitude=12000
speaker.fadeSamples=400
speaker.lineBufferBytes=4096
