# SynKinect Studio Interactivity V1 - shared canonical RGBD 3D pipeline.
# Acquisition, RGB/Depth synchronization and calibration are owned by the single
# shared RGBD core configured in scanner.properties. Interactivity has no camera
# transport, IR, synchronization or calibration aliases of its own.
transport.workerJoinMs=2200
transport.streamStaleMs=2200

vision.sampleStep=2
vision.previewHz=15
vision.minDepthMm=550
vision.maxDepthMm=3800
vision.minClusterSamples=90
vision.componentDepthToleranceMm=190
vision.minPersonWidthPx=42
vision.minPersonHeightPx=92
vision.maxPersonFrameCoverage=0.82
vision.smoothing=0.30
vision.minConfidence=0.24

fusion.rgbRefineRadiusPx=12
fusion.rgbHandRefineRadiusPx=18
fusion.depthJointRadiusPx=7
fusion.rgbEdgeWeight=0.44

hand.holdFrames=3
hand.temporalBiasPx=62
hand.fingerAngularBins=96
hand.maxFingerCount=5
hand.palmRadiusMinPx=9
hand.palmRadiusMaxPx=38
hand.fingerMinReach=1.30
hand.fingerMinSeparationDeg=16
hand.poseSmoothing=0.34

# Body-relative 3D interaction volume.
cursor.hand=right
cursor.mirrorX=true
cursor.maxHz=60
cursor.lostReleaseMs=800
cursor.deadzonePx=1.8
cursor.slowAlpha=0.20
cursor.fastAlpha=0.62
cursor.fastDistancePx=42
cursor.volumeHalfWidthM=0.55
cursor.volumeTopM=0.42
cursor.volumeBottomM=0.48
cursor.minHandForwardM=0.03

gesture.openThreshold=0.62
gesture.closeThreshold=0.38
gesture.opennessSmoothing=0.28
gesture.twoHandStableMs=180
gesture.doubleClickStableMs=170
gesture.doubleClickCooldownMs=700
gesture.scrollCooldownMs=45
gesture.scrollThresholdM=0.018
gesture.scrollGainPerM=82

cloud.particles=300
cloud.trailSamples=22
cloud.radiusPx=24
cloud.spring=42
cloud.damping=7.0
cloud.flow=0.24
cloud.trailStrength=1.0
cloud.stretchGain=0.020
cloud.maxStretch=3.0
cloud.desktopOverlay=true
