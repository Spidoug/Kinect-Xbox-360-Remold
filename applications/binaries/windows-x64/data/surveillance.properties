# SynKinect Surveillance. All policy lives here; source contains no deployment-specific password.
app.language=en-US
ui.frameRate=30
ui.font.family=Segoe UI
ui.font.headingFamily=Segoe UI Semibold
ui.font.fallback=Arial
lifecycle.workerJoinMs=1800

# Transport / automatic state switching
transport.streamStaleMs=1500
transport.connectionStaleMs=3000
transport.reconnectMs=250

# Motion detection. Idle mode detects on raw IR; recording mode detects on RGB luma.
motion.sampleStep=8
motion.irDelta=26
motion.rgbDelta=24
motion.minimumChangedRatio=0.025
motion.armFrames=3
motion.warmupFrames=10
motion.stopAfterMs=60000


# Low-light policy. RGB is sampled after motion begins; sustained darkness falls back to IR without ending the event.
lowLight.enabled=true
lowLight.lumaThreshold=42
lowLight.sampleStep=8
lowLight.warmupFrames=8
lowLight.darkFrames=6

# Burn date/time into preview and recorded MJPEG frames.
overlay.timestamp.enabled=true
overlay.timestamp.format=yyyy-MM-dd HH:mm:ss
overlay.timestamp.margin=14

# Motion-JPEG AVI recording. Output uses its own constant-frame-rate timeline and periodic RIFF checkpoints.
record.fps=15
record.jpegQuality=0.86
record.frameHoldMs=1500
record.checkpointFrames=30
record.directory=recordings

# IP-camera HTTP/MJPEG is provided by the native driver runtime service.
# Use drivers\windows\binaries\KINECT.cmd -> Show IP camera URLs / credentials.
