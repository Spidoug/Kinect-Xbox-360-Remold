# SynKinect Surveillance V1. English is the primary language.
app.language=en-US
ui.frameRate=30
ui.font.family=Segoe UI
ui.font.headingFamily=Segoe UI Semibold
ui.font.fallback=Arial
lifecycle.workerJoinMs=1800

# Transport / automatic state switching
transport.streamStaleMs=2400
transport.connectionStaleMs=6500
transport.reconnectMs=180
transport.videoQueueFrames=32
transport.drainFramesPerDraw=8

# Motion detection. Idle detects on raw IR; recording detects on RGB luma.
motion.sampleStep=8
motion.irDelta=26
motion.rgbDelta=24
motion.minimumChangedRatio=0.025
motion.armFrames=3
motion.warmupFrames=10
motion.stopAfterMs=60000

# Low-light: sustained darkness changes recording input to IR without ending event.
lowLight.enabled=true
lowLight.lumaThreshold=42
lowLight.sampleStep=8
lowLight.warmupFrames=8
lowLight.darkFrames=6

# Burn date/time into the encoded H.264 frames.
overlay.timestamp.enabled=true
overlay.timestamp.format=yyyy-MM-dd HH:mm:ss
overlay.timestamp.margin=14

# Compact video contract: MP4/H.264 only. 384 kbit/s is about 2.9 MB/minute
# before MP4 overhead, with 512x384 at 10 fps. FFmpeg/libx264 is required.
record.ffmpegExecutable=ffmpeg
record.fps=10
record.width=512
record.height=384
record.bitrateKbps=384
record.maxBitrateKbps=512
record.bufferKbps=768
record.preset=veryfast
record.frameHoldMs=1800
record.directory=recordings

# IP-camera HTTP/MJPEG remains a separate native runtime service; surveillance
# event files themselves are always compact H.264 MP4.
